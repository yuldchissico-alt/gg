services:
  - type: web
    name: pilotzap
    env: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/whatsapp/status
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_HEADLESS
        value: "true"
      - key: WHATSAPP_CHROME_PATH
        value: "/usr/bin/chromium"
    disk:
      name: pilotzap-wwebjs-data
      mountPath: /app/auth_info
      sizeGB: 1
