services:
  - type: web
    name: pilotzap
    env: node
    plan: starter
    region: frankfurt
    buildCommand: pnpm install && pnpm run build
    startCommand: node dist/index.js
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_HEADLESS
        value: "true"
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "false"
    disk:
      name: pilotzap-wwebjs-data
      mountPath: /app/auth_info
      sizeGB: 1
