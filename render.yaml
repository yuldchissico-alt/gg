services:
  - type: web
    name: pilotzap
    env: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
    disk:
      name: pilotzap-auth-data
      mountPath: /app/auth_info
      sizeGB: 1
